principles:
  - name: Visibility
    description: Not applicable on a developer surface; electric and gas consumption is metered at the
      customer premise and reported on the utility bill, not via an API.
  - name: Allocation
    description: Not applicable - Southern Company is a regulated utility holding company without developer/tenant
      cost-allocation semantics.
  - name: Optimization
    description: Not applicable at the API/FinOps layer.
