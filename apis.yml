name: Southern Company
description: Southern Company is a leading American gas and electric utility holding company headquartered in Atlanta,
  Georgia. Through its subsidiaries — Alabama Power, Georgia Power, Mississippi Power, Southern Natural Gas, and
  Southern Company Gas — it serves 9 million gas and electric utility customers across 6 states. Southern Company
  is a Fortune 500 company with operations spanning electricity generation, transmission, distribution, and natural
  gas distribution.
